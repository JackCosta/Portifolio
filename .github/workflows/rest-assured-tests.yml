name: Rest Assured (reutilizável)

on:
  workflow_call:
    inputs:
      suite:
        description: Identificador da suíte (nome do artefato de resultados)
        required: true
        type: string
      name:
        description: Nome exibido do job
        required: true
        type: string
      tags:
        description: Expressão de tags Cucumber
        required: false
        type: string
        default: "not @bug"
      base-url:
        required: true
        type: string
      allow-failure:
        description: Não reprova o pipeline (usado nos defeitos conhecidos)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rest-assured:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.allow-failure }}
    defaults:
      run:
        working-directory: Back-Rest-Assured
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION || 21 }}
          cache: maven
          cache-dependency-path: Back-Rest-Assured/pom.xml

      - name: Executar testes
        # Inputs passados por variável de ambiente para evitar injeção de comandos no shell.
        run: ./mvnw -B -ntp test -Dcucumber.filter.tags="$TAGS"
        env:
          TAGS: ${{ inputs.tags }}
          BASE_URL: ${{ inputs.base-url }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'admin' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'password123' }}

      - name: Gerar relatório Allure
        if: ${{ !cancelled() }}
        run: npx --yes allure-commandline@2 generate target/allure-results -o target/allure-report --clean

      - name: Publicar resultados e evidências
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.suite }}
          path: |
            Back-Rest-Assured/target/surefire-reports/
            Back-Rest-Assured/target/cucumber-report/
            Back-Rest-Assured/target/allure-report/
          if-no-files-found: warn
          retention-days: 14
