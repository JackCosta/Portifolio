name: API Tests (Rest Assured)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Execução diária (06:00 BRT) para detectar mudanças na API pública.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: "Expressão de tags Cucumber (ex.: @smoke, @negative, not @bug, @bug)"
        required: false
        default: "not @bug"
      base_url:
        description: "URL base da API"
        required: false
        default: "https://restful-booker.herokuapp.com"

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar testes
        run: ./mvnw -B -ntp test-compile

  smoke:
    name: Smoke (@smoke)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar smoke
        run: ./mvnw -B -ntp test -Dcucumber.filter.tags="@smoke"
        env:
          BASE_URL: ${{ inputs.base_url || 'https://restful-booker.herokuapp.com' }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'admin' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'password123' }}

  regression:
    name: Regressão
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar testes
        # Inputs passados por variável de ambiente para evitar injeção de comandos no shell.
        run: ./mvnw -B -ntp test -Dcucumber.filter.tags="$TAGS"
        env:
          TAGS: ${{ inputs.tags || 'not @bug' }}
          BASE_URL: ${{ inputs.base_url || 'https://restful-booker.herokuapp.com' }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'admin' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'password123' }}

      - name: Publicar resultado no GitHub Checks
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Resultado dos testes de API

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22

      - name: Gerar relatório Allure
        if: always()
        run: npx --yes allure-commandline@2 generate target/allure-results -o target/allure-report --clean

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            target/allure-report/
            target/cucumber-report/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
